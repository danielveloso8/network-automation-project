name: projeto-ccna
topology:
  nodes:
    R1:
      kind: linux
      image: frrouting/frr:latest
    CSW1:
      kind: linux
      image: frrouting/frr:latest
    CSW2:
      kind: linux
      image: frrouting/frr:latest
    ISPA:
      kind: linux
      image: frrouting/frr:latest
    ISPB:
      kind: linux
      image: frrouting/frr:latest
    DSW-A1:
      kind: linux
      image: frrouting/frr:latest
    DSW-A2:
      kind: linux
      image: frrouting/frr:latest
    DSW-B1:
      kind: linux
      image: frrouting/frr:latest
    DSW-B2:
      kind: linux
      image: frrouting/frr:latest

  links:
    - endpoints: ["R1:eth1", "ISPA:eth1"]
    - endpoints: ["R1:eth2", "ISPB:eth1"]
    - endpoints: ["R1:eth3", "CSW1:eth1"]
    - endpoints: ["R1:eth4", "CSW2:eth1"]
    - endpoints: ["CSW1:eth2", "CSW2:eth2"]
    - endpoints: ["CSW1:eth3", "CSW2:eth3"]
    - endpoints: ["CSW1:eth4", "DSW-A1:eth1"]
    - endpoints: ["CSW1:eth5", "DSW-A2:eth1"]
    - endpoints: ["CSW2:eth4", "DSW-A1:eth2"]
    - endpoints: ["CSW2:eth5", "DSW-A2:eth2"]
    - endpoints: ["CSW1:eth6", "DSW-B1:eth1"]
    - endpoints: ["CSW1:eth7", "DSW-B2:eth1"]
    - endpoints: ["CSW2:eth6", "DSW-B1:eth2"]
    - endpoints: ["CSW2:eth7", "DSW-B2:eth2"]